<div class="container mt-4">
  <h2>Gestión de Profesores</h2>
  
  <div class="row mb-3">
    <div class="col-md-6">
      <div class="input-group">
        <input type="text" class="form-control" [(ngModel)]="filterValue" placeholder="Buscar por nombre..." (keyup.enter)="filterProfesores()">
        <button class="btn btn-outline-secondary" (click)="filterProfesores()">Buscar</button>
        <button class="btn btn-outline-secondary" (click)="filterValue=''; loadProfesores()">Limpiar</button>
      </div>
    </div>
    <div class="col-md-6 text-end">
      <button class="btn btn-primary" (click)="openCreateForm()">+ Nuevo Profesor</button>
    </div>
  </div>

  <div class="card mb-3" *ngIf="showForm">
    <div class="card-header">
      <h5>{{ isEditing ? 'Editar' : 'Nuevo' }} Profesor</h5>
    </div>
    <div class="card-body">
      <form (ngSubmit)="saveProfesor()">
        <div class="mb-3">
          <label class="form-label">Nombre</label>
          <input type="text" class="form-control" [(ngModel)]="formData.nombre" name="nombre" required>
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-success">Guardar</button>
          <button type="button" class="btn btn-secondary" (click)="closeForm()">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <div class="table-responsive">
    <table class="table table-striped table-hover">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let profesor of profesores">
          <td>{{ profesor.id }}</td>
          <td>{{ profesor.nombre }}</td>
          <td>
            <button class="btn btn-sm btn-warning me-2" (click)="openEditForm(profesor)">Editar</button>
            <button class="btn btn-sm btn-danger" (click)="deleteProfesor(profesor.id)">Eliminar</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
